name: Validate public news search
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'next.config.mjs'
      - '.github/workflows/validate-news-search.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # El proyecto no tiene package-lock.json; usar npm install hasta fijar un lockfile.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run check
      - name: Compilación de producción
        run: npm run build
