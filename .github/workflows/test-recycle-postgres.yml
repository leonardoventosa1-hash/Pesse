name: Test recycle-bin migration in PostgreSQL
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pesse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: pesse_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up disposable schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/checks/ci_fixture.sql
      - name: Apply recycle-bin migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031_recycle_bin.sql
      - name: Ensure published articles are visible to anonymous visitors
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role anon;
          do $
          begin
            if not exists(select 1 from public.articles where id='00000000-0000-0000-0000-000000000001') then
              raise exception 'Published article is unexpectedly hidden';
            end if;
          end $;
          SQL
      - name: Test trash and restore, privilege checks
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          select set_config('app.test_is_admin','true',false);
          select public.trash_article('00000000-0000-0000-0000-000000000001');
          do $$
          begin
            if not exists(select 1 from public.articles where deleted_at is not null and status='draft' and published_at is null and is_featured=false) then
              raise exception 'Trash did not unpublish the article';
            end if;
          end $$;
          select public.restore_article('00000000-0000-0000-0000-000000000001');
          do $$
          begin
            if not exists(select 1 from public.articles where deleted_at is null and status='draft' and published_at is null) then
              raise exception 'Restore did not return article as draft';
            end if;
            if has_function_privilege('anon','public.trash_article(uuid)','EXECUTE') then
              raise exception 'Anonymous user must not execute trash';
            end if;
          end $$;
          SQL
      - name: Ensure restored drafts stay private to anonymous visitors
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role anon;
          do $
          begin
            if exists(select 1 from public.articles where id='00000000-0000-0000-0000-000000000001') then
              raise exception 'Restored draft unexpectedly visible publicly';
            end if;
          end $;
          SQL
      - name: Reject unauthorized RPC calls as authenticated redactor
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          select set_config('app.test_is_admin','false',false);
          set role authenticated;
          do $$
          declare blocked boolean;
          begin
            blocked := false;
            begin
              perform public.trash_article('00000000-0000-0000-0000-000000000001');
            exception when insufficient_privilege then blocked := true;
            end;
            if not blocked then raise exception 'Redactor incorrectly allowed to trash'; end if;
            blocked := false;
            begin
              perform public.restore_article('00000000-0000-0000-0000-000000000001');
            exception when insufficient_privilege then blocked := true;
            end;
            if not blocked then raise exception 'Redactor incorrectly allowed to restore'; end if;
          end $$;
          SQL
      - name: Reject permanent deletion as authenticated user
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          select set_config('request.jwt.claim.role','authenticated',false);
          set role authenticated;
          do $$
          declare blocked boolean := false;
          begin
            begin
              delete from public.articles where id='00000000-0000-0000-0000-000000000001';
            exception when insufficient_privilege then blocked := true;
            end;
            if not blocked then raise exception 'Direct article deletion unexpectedly succeeded'; end if;
          end $$;
          SQL
      - name: Reject missing or already restored articles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          select set_config('app.test_is_admin','true',false);
          do $$
          declare blocked boolean;
          begin
            blocked := false;
            begin
              perform public.trash_article('00000000-0000-0000-0000-000000000099');
            exception when no_data_found then blocked := true;
            end;
            if not blocked then raise exception 'Missing article was silently trashed'; end if;
            blocked := false;
            begin
              perform public.restore_article('00000000-0000-0000-0000-000000000001');
            exception when no_data_found then blocked := true;
            end;
            if not blocked then raise exception 'Already restored article was silently restored again'; end if;
          end $$;
          SQL
      - name: Ensure trashed stories are invisible to anonymous visitors
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          update public.articles set status='published',published_at=now()
          where id='00000000-0000-0000-0000-000000000001';
          select set_config('app.test_is_admin','true',false);
          select public.trash_article('00000000-0000-0000-0000-000000000001');
          set role anon;
          do $$
          begin
            if exists(select 1 from public.articles where id='00000000-0000-0000-0000-000000000001') then
              raise exception 'Trashed article leaked through public SELECT';
            end if;
          end $$;
          reset role;
          SQL
      - name: Block redactor edits on trashed stories
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          select set_config('app.test_is_admin','true',false);
          -- The previous privacy test left the fixture article in the trash.
          select set_config('app.test_is_admin','false',false);
          set role authenticated;
          do $$
          declare blocked boolean := false;
          begin
            begin
              update public.articles set title='Unauthorized edit'
              where id='00000000-0000-0000-0000-000000000001';
            exception when insufficient_privilege then blocked := true;
            end;
            if not blocked then
              raise exception 'Redactor could edit a trashed article';
            end if;
          end $$;
          SQL
