name: Validate editorial publication permissions
on:
  pull_request:
    paths:
      - "src/components/Editor.tsx"
      - "src/components/EditorialReview.tsx"
      - "supabase/migrations/*guard_admin_publication.sql"
      - ".github/workflows/validate-editorial-publication.yml"
  push:
    branches: [main]
    paths:
      - "src/components/Editor.tsx"
      - "src/components/EditorialReview.tsx"
      - "supabase/migrations/*guard_admin_publication.sql"
      - ".github/workflows/validate-editorial-publication.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run check
      - name: Validate publication permission contract
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {readFile} from "node:fs/promises";
          const editor=await readFile("src/components/Editor.tsx","utf8");
          const review=await readFile("src/components/EditorialReview.tsx","utf8");
          const sql=await readFile("supabase/migrations/20261106193000_guard_admin_publication.sql","utf8");
          assert.match(editor,/editorialRole!=="admin"/,"El editor debe impedir publicación sin permisos");
          assert.match(editor,/<option value="published">Publicar<\/option>/);
          assert.match(editor,/editorialRole==="admin"&&<option/);
          assert.match(review,/canPublish:boolean/,"Checklist debe diferenciar administradores");
          assert.match(sql,/before insert or update on public\.articles/i);
          assert.match(sql,/new\.status = 'published'/);
          assert.match(sql,/old\.status = 'published'/);
          assert.match(sql,/not public\.is_admin\(\)/);
          assert.match(sql,/revoke all on function public\.guard_article_publication\(\)/i);
          console.log("Contrato editorial y migración preparada OK; pendiente aplicar RLS/trigger en Supabase.");
          NODE
