name: Verify published Pesse site
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live homepage, search, and sitemap
        shell: bash
        env:
          BASE_URL: https://pesse-gilt.vercel.app
        run: |
          set -euo pipefail
          for path in / /buscar "/buscar?q=pesse" /sitemap.xml /robots.txt /rss.xml; do
            echo "Checking ${BASE_URL}${path}"
            status=$(curl --location --silent --show-error --max-time 25 --output /tmp/pesse-body --write-out '%{http_code}' "${BASE_URL}${path}")
            echo "HTTP ${status}"
            if [[ "${status}" != "200" ]]; then
              echo "::error::Published site returned HTTP ${status} for ${path}"
              exit 1
            fi
            if grep -Eqi 'Authentication Required|Vercel Authentication|Log in to Vercel' /tmp/pesse-body; then
              echo "::error::Vercel authentication is blocking public access to ${path}"
              exit 1
            fi
            if [[ "${path}" == "/" ]] && ! grep -qi 'Pesse' /tmp/pesse-body; then
              echo "::error::Homepage is missing Pesse branding"
              exit 1
            fi
            if [[ "${path}" == "/robots.txt" ]] && ! grep -q 'sitemap.xml' /tmp/pesse-body; then
              echo "::error::robots.txt does not advertise the sitemap"
              exit 1
            fi
            if [[ "${path}" == "/buscar" ]] && ! grep -qi 'Buscar noticias' /tmp/pesse-body; then
              echo "::error::Published search page does not contain its expected heading"
              exit 1
            fi
            if [[ "${path}" == "/rss.xml" ]] && ! grep -q '<rss' /tmp/pesse-body; then
              echo "::error::RSS feed is not available"
              exit 1
            fi
            if [[ "${path}" == "/sitemap.xml" ]] && ! grep -q '<urlset' /tmp/pesse-body; then
              echo "::error::Published sitemap does not contain an XML URL set"
              exit 1
            fi
          done
