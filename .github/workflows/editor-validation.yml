name: Validate editorial editor
on:
  pull_request:
    paths:
      - 'src/components/Editor.tsx'
      - 'src/components/VisualEditor.tsx'
      - 'src/components/ArticleBody.tsx'
      - 'src/app/noticias/**'
      - 'src/app/globals.css'
      - 'package.json'
      - '.github/workflows/editor-validation.yml'
  workflow_dispatch:

# Una ejecución activa por PR: los commits nuevos descartan validaciones obsoletas.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  editor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Sin npm install ni build: la compilación se ejecuta UNA sola vez
      # en Validate public news search cuando cambia src/**.
      - name: Validar estructura básica del editor sin dependencias
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from "node:fs/promises";
          import assert from "node:assert/strict";
          const editor=await readFile("src/components/Editor.tsx","utf8");
          const visual=await readFile("src/components/VisualEditor.tsx","utf8");
          const article=await readFile("src/components/ArticleBody.tsx","utf8");
          assert.match(editor,/export default function Editor\(/);
          assert.match(editor,/async function save\(/);
          assert.match(editor,/is_editor/);
          assert.match(editor,/function exportMarkdown\(/);
          assert.match(visual,/export default function VisualEditor\(/);
          assert.ok(article.includes("ArticleBody"),"Falta ArticleBody");
          console.log("Contrato editorial OK (sin compilar dos veces)");
          NODE
